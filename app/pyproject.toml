[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cuktech-ble-controller"
version = "0.1.0"
description = "Local BLE controller and web UI for the CUKTECH 10 GaN Charger Ultra."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "CUKTECH BLE Controller contributors" }]
dependencies = [
  "aiohttp>=3.9",
  "bleak>=0.21",
  "cryptography>=41",
]

[project.urls]
Homepage = "https://github.com/zhyzhaogit/cuktech-ble-controller"
Issues = "https://github.com/zhyzhaogit/cuktech-ble-controller/issues"

[project.scripts]
cuktech-ble = "cuktech_ble_controller.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
