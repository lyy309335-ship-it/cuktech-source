<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CUKTECH 充电器控制面板</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f1117;
  --card: #1a1d27;
  --card-border: #2a2d3a;
  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --green: #22c55e;
  --green-dim: #166534;
  --red: #ef4444;
  --amber: #f59e0b;
  --text: #e2e8f0;
  --text-dim: #94a3b8;
  --text-bright: #f8fafc;
  --radius: 10px;
  --touch-min: 44px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

/* Header */
.header {
  background: var(--card);
  border-bottom: 1px solid var(--card-border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  gap: 12px;
}

.header-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

.header h1 {
  font-size: 17px;
  font-weight: 600;
  color: var(--text-bright);
  letter-spacing: 0.3px;
  white-space: nowrap;
}

.energy-flow {
  --flow-level: 0;
  --flow-speed: 2s;
  --pulse-speed: 2.2s;
  --flow-bright: 0.5;
  --tail-alpha: 0.35;
  /* 轨道宽度唯一来源：轨道自身和光点/尾迹的位移距离都取它，
     动画里用 calc(var(--track-w) - Npx) 就能在任何宽度下跑到头 */
  --track-w: 230px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text-dim);
}

.energy-icon {
  font-size: 14px;
  line-height: 1;
  opacity: 0.9;
}

.flow-track {
  position: relative;
  width: var(--track-w);
  height: 14px;
  border-radius: 999px;
  border: 1px solid var(--card-border);
  background: linear-gradient(90deg, rgba(59,130,246,0.08), rgba(34,197,94,0.08));
  overflow: hidden;
  /* 把轨道独立成一层：里面的条纹/光点移动时不必让整页重排 */
  contain: paint;
}

/* 进度不再用 width 过渡 —— 实测那是掉帧的真凶：
   width 每帧都会触发 layout + 重绘（4 个口 + 头部 = 175 次/秒），
   平均吃掉渲染进程 30% 的主线程。改成「条纹铺满整条轨道 + 一块遮罩
   用 transform 平移」，两者都走合成器，主线程 0 布局。 */
.flow-mask {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: var(--card);
  /* 直接写 translateX(n%)，不要写成 calc(var(--fill) * 100%)：
     带 var() 的 transform 在过渡时 Chromium 会退回主线程、逐帧重算样式
     （实测 130 次/秒），纯百分比的 translateX 才能交给合成器。 */
  transform: translateX(0);
  transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
  will-change: transform;
  pointer-events: none;
}

/* 条纹层：铺满轨道，用 transform 跑循环（合成器线程，不触发重绘/重排）。
   右边多留 80px，向左平移时右侧不会露出空白。
   一个周期 = 16px，位移取 32px（整数倍）——这样循环回到起点时图案
   完全对齐，看不出"跳一下"。原来的写法是 40px / 16px = 2.5 个周期，
   每轮结束错位半格，看着就是一顿一顿。 */
.flow-stripes {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  right: -80px;
  background:
    repeating-linear-gradient(
      90deg,
      rgba(59,130,246,0.10) 0px,
      rgba(59,130,246,0.10) 8px,
      rgba(34,197,94,0.55) 8px,
      rgba(34,197,94,0.55) 16px
    );
  opacity: var(--flow-bright);
  animation: flowStripe var(--flow-speed) linear infinite;
  transform: translate3d(0, 0, 0);
}

.energy-flow.active .flow-stripes { will-change: transform; }

.flow-pulse {
  position: absolute;
  top: 50%;
  left: 0;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  /* 原来动的是 left（每帧重排），改成 transform（纯合成） */
  transform: translate3d(-14px, -50%, 0);
  background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(34,197,94,0.9) 45%, rgba(59,130,246,0.15) 100%);
  box-shadow: 0 0 12px rgba(34,197,94,0.7);
  opacity: 0;
}

.energy-flow.active .flow-pulse {
  opacity: 1;
  animation: flowPulse var(--pulse-speed) linear infinite;
  will-change: transform, opacity;
}

.flow-tail {
  position: absolute;
  top: 50%;
  left: 0;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  transform: translate3d(-22px, -50%, 0) scale(0.8);
  opacity: 0;
  background: radial-gradient(circle,
    rgba(147, 197, 253, 0.95) 0%,
    rgba(59, 130, 246, 0.55) 42%,
    rgba(59, 130, 246, 0.18) 68%,
    rgba(34, 197, 94, 0) 100%);
  pointer-events: none;
}

/* 不再用 filter: blur() 做柔边 —— 带滤镜的元素在移动时要整层重新栅格化，
   改成渐变自己带衰减，栅格化一次就一直复用。 */
.flow-tail.t2 {
  width: 8px;
  height: 8px;
}

.energy-flow.boost.active .flow-tail {
  animation: flowTail var(--pulse-speed) linear infinite;
}

.energy-flow.boost.active .flow-tail.t2 {
  animation-delay: calc(var(--pulse-speed) * -0.22);
}

.energy-flow .power-val {
  min-width: 54px;
  text-align: right;
  font-size: 18px;
  font-weight: 700;
  color: #86efac;
  letter-spacing: 0.2px;
}

.energy-flow.zero .power-val {
  color: var(--text-dim);
}

/* 位移量必须是条纹周期（16px）的整数倍，否则每轮回到起点会错位半格 */
@keyframes flowStripe {
  from { transform: translate3d(0, 0, 0); }
  to   { transform: translate3d(-32px, 0, 0); }
}

@keyframes flowPulse {
  0%   { transform: translate3d(-14px, -50%, 0); opacity: 0; }
  8%   { opacity: 1; }
  92%  { opacity: 1; }
  100% { transform: translate3d(calc(var(--track-w) - 2px), -50%, 0); opacity: 0; }
}

@keyframes flowTail {
  0%   { transform: translate3d(-22px, -50%, 0) scale(0.8); opacity: 0; }
  12%  { opacity: var(--tail-alpha); }
  62%  { opacity: calc(var(--tail-alpha) * 0.75); }
  100% { transform: translate3d(calc(var(--track-w) - 6px), -50%, 0) scale(0.45); opacity: 0; }
}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.view-switch {
  display: flex;
  gap: 6px;
}

.view-btn {
  border: 1px solid var(--card-border);
  background: var(--bg);
  color: var(--text-dim);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 12px;
  cursor: pointer;
}

.view-btn.active {
  color: var(--text-bright);
  border-color: var(--primary);
  background: rgba(59,130,246,0.18);
}

.status-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #64748b;
  display: inline-block;
  transition: background 0.3s;
}
.status-dot.ready { background: var(--green); box-shadow: 0 0 8px var(--green); }
.status-dot.connecting { background: var(--amber); animation: pulse 1s infinite; }
.status-dot.disconnected { background: #64748b; }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.status-text {
  font-size: 13px;
  color: var(--text-dim);
}

.btn-icon {
  width: 36px;
  height: 36px;
  border: 1px solid var(--card-border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text-dim);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}
.btn-icon:hover { border-color: var(--primary); color: var(--primary); }
.btn-icon:active { background: var(--primary); color: #fff; }
.btn-icon.spinning { animation: spin 0.8s linear infinite; }

.btn {
  padding: 8px 18px;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  color: #fff;
  min-height: var(--touch-min);
}
.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.btn-primary { background: var(--primary); }
.btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
.btn-danger { background: var(--red); }
.btn-danger:hover:not(:disabled) { background: #dc2626; }
.btn-small {
  padding: 6px 14px;
  font-size: 12px;
  min-height: 32px;
}

/* Offline banner */
.offline-banner {
  background: #78350f;
  border-bottom: 1px solid var(--amber);
  color: var(--amber);
  text-align: center;
  padding: 8px 16px;
  font-size: 13px;
  display: none;
}
.offline-banner.visible { display: block; }

/* Main content */
.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  padding: 16px;
}

.card-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-bright);
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--card-border);
}

.history-toolbar {
  display: grid;
  /* v1.4.2：指标下拉已去掉（只剩功率），列数从 5 变 4 */
  grid-template-columns: 1fr 1fr 1fr auto;
  gap: 10px;
  margin-bottom: 12px;
}

.history-toolbar select,
.history-toolbar input {
  width: 100%;
  border: 1px solid var(--card-border);
  background: var(--bg);
  color: var(--text);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 13px;
}

.chart-wrap {
  background: rgba(255, 255, 255, 0.01);
  border: 1px solid var(--card-border);
  border-radius: 10px;
  padding: 10px 10px 14px;
  margin-bottom: 10px;
  height: 320px;
  overflow: visible;
}

.chart-title {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 6px;
}

.chart-canvas {
  width: 100%;
  height: calc(100% - 28px);
  display: block;
}

.hidden {
  display: none !important;
}

/* Disabled overlay for when not connected */
.controls-disabled {
  pointer-events: none;
  opacity: 0.4;
  filter: grayscale(0.5);
}

/* Port cards */
.ports-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.port-card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  padding: 14px 10px;
  text-align: center;
  transition: border-color 0.3s;
  position: relative;
  overflow: hidden;
}

.port-card.active {
  border-color: var(--green);
}

.port-card.power-low {
  box-shadow: inset 0 0 0 1px rgba(34, 197, 94, 0.28);
}
.port-card.power-mid {
  box-shadow: inset 0 0 0 1px rgba(245, 158, 11, 0.32), 0 0 14px rgba(245, 158, 11, 0.12);
}
.port-card.power-high {
  box-shadow: inset 0 0 0 1px rgba(239, 68, 68, 0.38), 0 0 18px rgba(239, 68, 68, 0.2);
  animation: powerPulse 1.1s ease-in-out infinite;
}

@keyframes powerPulse {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-1px); }
}

.port-name {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-bright);
  margin-bottom: 2px;
}

.port-type {
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 10px;
}

/* Port data display */
.port-data {
  margin: 6px 0;
  font-size: 12px;
  color: var(--text-dim);
  min-height: 44px;
}
.port-power {
  font-size: 22px;
  font-weight: 700;
  color: var(--text-bright);
  margin-bottom: 2px;
}
.port-power.zero { color: var(--text-dim); font-size: 16px; }
.port-detail {
  font-size: 11px;
  color: var(--text-dim);
}

/* Power bar */
.power-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: rgba(255,255,255,0.05);
}
.power-fill {
  height: 100%;
  width: 100%;
  /* 同样是 width → transform：宽度每帧变化会带 layout，scaleX 不会。
     3px 高的纯色条，横向拉伸对圆角的影响看不出来。 */
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), background 0.5s ease;
  border-radius: 0 2px 2px 0;
  will-change: transform;
}


/* Toggle switch */
.toggle-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 6px 0;
}

.toggle {
  position: relative;
  width: 44px;
  height: 24px;
  cursor: pointer;
  flex-shrink: 0;
}
.toggle input { display: none; }
.toggle .slider {
  position: absolute;
  inset: 0;
  background: #334155;
  border-radius: 12px;
  transition: background 0.3s;
}
.toggle .slider::before {
  content: '';
  position: absolute;
  left: 3px;
  top: 3px;
  width: 18px;
  height: 18px;
  background: #fff;
  border-radius: 50%;
  transition: transform 0.3s;
}
.toggle input:checked + .slider { background: var(--green); }
.toggle input:checked + .slider::before { transform: translateX(20px); }

.toggle-label {
  font-size: 12px;
  color: var(--text-dim);
}

/* Timer presets */
.timer-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin-top: 8px;
  flex-wrap: wrap;
}
.timer-preset {
  padding: 4px 8px;
  border: 1px solid var(--card-border);
  border-radius: 4px;
  background: var(--bg);
  color: var(--text-dim);
  font-size: 11px;
  cursor: pointer;
  transition: all 0.2s;
  min-height: 28px;
}
.timer-preset:hover { border-color: var(--primary); color: var(--primary); }
.timer-preset:active { background: var(--primary); color: #fff; }
.timer-input {
  width: 42px;
  padding: 4px;
  border: 1px solid var(--card-border);
  border-radius: 4px;
  background: var(--bg);
  color: var(--text);
  font-size: 12px;
  text-align: center;
}
.timer-set-btn {
  padding: 4px 8px;
  border: none;
  border-radius: 4px;
  background: var(--primary);
  color: #fff;
  font-size: 11px;
  cursor: pointer;
  min-height: 28px;
}

/* Settings rows */
.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid #1e2130;
  gap: 12px;
}
.setting-row:last-child { border-bottom: none; }

.setting-label {
  font-size: 14px;
  color: var(--text);
  flex-shrink: 0;
}

/* Segmented control */
.seg-group {
  display: flex;
  gap: 4px;
  background: var(--bg);
  padding: 3px;
  border-radius: 8px;
  flex-wrap: wrap;
}

.seg-btn {
  padding: 6px 12px;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--text-dim);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
  min-height: 32px;
}
.seg-btn:hover { color: var(--text); }
.seg-btn.active {
  background: var(--primary);
  color: #fff;
  font-weight: 500;
}

/* Sending state (prevent double-tap) */
.sending {
  opacity: 0.6;
  pointer-events: none;
  animation: sendPulse 0.8s ease infinite;
}
@keyframes sendPulse {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 0.35; }
}

/* Page buttons */
.page-btns {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.page-btn {
  width: 40px;
  height: 40px;
  border: 1px solid var(--card-border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.page-btn:hover { border-color: var(--primary); color: var(--primary); }
.page-btn:active { background: var(--primary); color: #fff; }

/* Toast */
.toast-container {
  position: fixed;
  top: 70px;
  right: 16px;
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.toast {
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 13px;
  color: #fff;
  animation: slideIn 0.3s ease;
  max-width: 280px;
  pointer-events: auto;
}
.toast.success { background: var(--green-dim); border: 1px solid var(--green); }
.toast.error { background: #7f1d1d; border: 1px solid var(--red); }
.toast.info { background: #1e3a5f; border: 1px solid var(--primary); }

@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
@keyframes slideUp {
  from { transform: translateY(100%); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

/* Loading spinner on buttons */
.loading {
  position: relative;
  color: transparent !important;
}
.loading::after {
  content: '';
  position: absolute;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  left: 50%;
  top: 50%;
  margin: -8px 0 0 -8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ========================================
   Responsive: Tablet (≤768px)
   ======================================== */
@media (max-width: 768px) {
  .ports-grid { grid-template-columns: repeat(2, 1fr); }
  .container { padding: 14px; gap: 14px; }
}

/* ========================================
   Responsive: Phone (≤480px)
   ======================================== */
@media (max-width: 480px) {
  .header {
    flex-wrap: wrap;
    padding: 10px 14px;
    gap: 8px;
  }
  .header h1 { font-size: 15px; }
  .energy-flow { --track-w: 160px; }
  .flow-track { height: 12px; }
  .energy-flow .power-val { font-size: 16px; min-width: 50px; }

  .header-right { width: 100%; justify-content: space-between; }
  #connectBtn { flex: 1; }

  .container { padding: 10px; gap: 10px; }
  .card { padding: 14px 12px; }
  .ports-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .port-card { padding: 12px 8px; }
  .port-name { font-size: 16px; }
  .port-power { font-size: 20px; }

  /* Stack setting rows vertically */
  .setting-row {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }

  /* Segmented buttons: grid wrap */
  .seg-group {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
    gap: 4px;
  }
  .seg-btn {
    padding: 8px 6px;
    font-size: 12px;
    min-height: var(--touch-min);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Enlarge toggles */
  .toggle { width: 52px; height: 28px; }
  .toggle .slider { border-radius: 14px; }
  .toggle .slider::before { width: 22px; height: 22px; }
  .toggle input:checked + .slider::before { transform: translateX(24px); }

  /* Timer input enlarge */
  .timer-input {
    width: 54px;
    padding: 6px;
    font-size: 16px; /* prevent iOS zoom */
  }
  .timer-preset { padding: 6px 10px; font-size: 12px; min-height: 36px; }

  .history-toolbar {
    grid-template-columns: 1fr;
  }

  /* Page buttons enlarge */
  .page-btn { width: 48px; height: 48px; font-size: 18px; }

  /* Toast at bottom on mobile */
  .toast-container {
    top: auto;
    bottom: 16px;
    right: 12px;
    left: 12px;
  }
  .toast {
    max-width: 100%;
    animation: slideUp 0.3s ease;
  }
}

/* ============================================================
   流光动画的启停策略（v1.4.2 重做）
   ------------------------------------------------------------
   v1.3.8 为了省 CPU，把这几组动画改成「数据一变才动 1.2 秒」，
   结果是充电时流光不停地在 冻结 → 恢复 之间切换，看起来就是卡顿；
   再叠加当时动的是 background-position / left（每帧重绘+重排），
   掉帧就明显了。

   现在两条一起改：
   1) 动画全部走 transform / opacity（合成器线程），主线程零负担；
   2) 只在真正该动的时候动 —— 有功率输出时连续跑，功率为 0 时暂停
      （此时进度条宽度本来就是 0，静止画面和暂停完全一致）。
   窗口隐藏（收进托盘 / 锁屏）仍然全页暂停，这条是省电兜底。
   ============================================================ */
.energy-flow.zero .flow-stripes,
.energy-flow.zero .flow-pulse,
.energy-flow.zero .flow-tail {
  animation-play-state: paused;
}

/* 窗口隐藏（收进托盘 / 锁屏）时，全页动画一律停。
   viz-paused 只由 __ck.setPaused / visibilitychange 触发。 */
html.viz-paused *,
html.viz-paused *::before,
html.viz-paused *::after {
  animation-play-state: paused !important;
}

/* 注意：这里刻意不加 `@media (prefers-reduced-motion: reduce)` 去 animation:none。
   实测本机 WebView2 报的就是 reduce（Windows「显示动画」相关设置会影响它），
   加了这条等于把流光动画永久关掉 —— 充电时那道流动光效直接不动了，
   属于用户没要求的视觉回退。控制动画只走上面 zero / viz-paused 两条通道。 */
</style>
</head>

    s.onload = function () {
      try { if (typeof loadHistoryData === 'function') loadHistoryData(); } catch (e) {}
    };
    document.head.appendChild(s);
  }
</script>
<script>
// ============================================================
// State
// ============================================================
let connectionState = 'DISCONNECTED';
let settings = {};
let updatingFromServer = false;
let ws = null;
let wsReconnectTimer = null;
let portDataCache = { c1: null, c2: null, c3: null, a: null };
let historyChart = null;

// ---- v1.3.8 渲染节流状态 ----
// dirtyPorts：本帧内有哪些端口收到了新消息
// rafPending：已经排了一帧，别重复排
const dirtyPorts = new Set();
let rafPending = false;

// v1.4.2：不再用 viz-idle 让动画「动 1.2 秒停一会儿」——
// 那种反复启停正是流光看着卡的直接原因。现在有功率就一直跑，
// 功率归零由 .energy-flow.zero 暂停（见 <style> 末尾的说明）。

// 一帧最多重绘一次：BLE 每秒可能推好几次，原来每次都整屏重排
function scheduleRender() {
  if (rafPending) return;
  if (document.documentElement.classList.contains('viz-paused')) return;
  rafPending = true;
  requestAnimationFrame(() => {
    rafPending = false;
    // 关键：排帧的那一刻还没暂停，回调真正执行时可能已经被 setPaused(true)。
    // 不复查就会在「暂停之后」再画一帧（实测能画出 59 个 DOM 变更），
    // 清掉脏标记，等恢复时 setPaused(false) 会重新全量补一遍。
    if (document.documentElement.classList.contains('viz-paused')) {
      dirtyPorts.clear();
      return;
    }
    if (!dirtyPorts.size) return;
    dirtyPorts.clear();
    renderPortsDisplay();
    updateTotalPower();
  });
}

const POWER_LIMITS = {
  ports: {
    c1: { sceneMax: 100, hardMax: 120 },
    c2: { sceneMax: 100, hardMax: 120 },
    c3: { sceneMax: 44, hardMax: 55 },
    a: { sceneMax: 22.5, hardMax: 30 },
  },
  total: { sceneMax: 110, hardMax: 125 },
};

// ============================================================
// Haptic feedback (Android only, silently ignored elsewhere)
// ============================================================
function haptic() { navigator.vibrate && navigator.vibrate(10); }

// ============================================================
// WebSocket
// ============================================================
function connectWebSocket() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws`);

  ws.onopen = () => {
    if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
    document.getElementById('offlineBanner').classList.remove('visible');
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'state') {
      updateConnectionState(msg.state);
    } else if (msg.type === 'settings') {
      updatingFromServer = true;
      settings = msg.settings;
      renderSettings();
      updatingFromServer = false;
    } else if (msg.type === 'port') {
      // v1.3.8：只记缓存 + 打脏标记，交给 requestAnimationFrame 合帧渲染
      portDataCache[msg.port] = msg;
      dirtyPorts.add(msg.port);
      scheduleRender();
    }
  };

  ws.onclose = () => {
    ws = null;
    // Show offline banner only if we were connected
    if (connectionState === 'READY') {
      document.getElementById('offlineBanner').classList.add('visible');
    }
    if (!wsReconnectTimer) {
      wsReconnectTimer = setTimeout(connectWebSocket, 2000);
    }
  };

  ws.onerror = () => { ws && ws.close(); };
}

// ============================================================
// Connection state
// ============================================================
function updateConnectionState(state) {
  connectionState = state;
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  const btn = document.getElementById('connectBtn');
  const controls = document.getElementById('controlsArea');

  dot.className = 'status-dot';

  if (state === 'READY') {
    dot.classList.add('ready');
    text.textContent = '已连接';
    btn.textContent = '断开';
    btn.className = 'btn btn-danger';
    btn.disabled = false;
    controls.classList.remove('controls-disabled');
    document.getElementById('offlineBanner').classList.remove('visible');
  } else if (state === 'CONNECTING' || state === 'AUTHENTICATING') {
    dot.classList.add('connecting');
    text.textContent = state === 'CONNECTING' ? '连接中...' : '认证中...';
    btn.textContent = '连接中...';
    btn.className = 'btn btn-primary loading';
    btn.disabled = true;
    controls.classList.add('controls-disabled');
  } else {
    dot.classList.add('disconnected');
    text.textContent = '未连接';
    btn.textContent = '连接设备';
    btn.className = 'btn btn-primary';
    btn.disabled = false;
    controls.classList.add('controls-disabled');
  }
}

function switchView(view) {
  const mainView = document.getElementById('mainView');
  const historyView = document.getElementById('historyView');
  const mainBtn = document.getElementById('view-main-btn');
  const historyBtn = document.getElementById('view-history-btn');

  if (view === 'history') {
    mainView.classList.add('hidden');
    historyView.classList.remove('hidden');
    mainBtn.classList.remove('active');
    historyBtn.classList.add('active');
    loadHistoryData();
  } else {
    historyView.classList.add('hidden');
    mainView.classList.remove('hidden');
    historyBtn.classList.remove('active');
    mainBtn.classList.add('active');
  }
}

// ============================================================
// Render settings to UI
// ============================================================
function renderSettings() {
  // Segmented buttons (piid 5, 6, 13)
  document.querySelectorAll('.seg-btn').forEach(btn => {
    const piid = btn.dataset.piid;
    const value = parseInt(btn.dataset.value);
    const current = settings[piid];
    const currentInt = current !== undefined ? parseInt(current) : undefined;
    const isScreenOneMinuteAlias = (piid === '6' && value === 5 && currentInt === 5);
    const isScreenFiveMinuteAlias = (piid === '6' && value === 1 && (currentInt === 0 || currentInt === 1));
    const isScreenAlwaysOnAlias = (piid === '6' && value === 4 && (currentInt === 4));
    if ((currentInt !== undefined && currentInt === value) || isScreenOneMinuteAlias || isScreenFiveMinuteAlias || isScreenAlwaysOnAlias) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
    btn.classList.remove('sending');
  });

  // Toggle switches (piid 15, 19, 20)
  [15, 19, 20].forEach(piid => {
    const el = document.getElementById(`toggle-${piid}`);
    if (el && settings[piid] !== undefined) {
      el.checked = parseInt(settings[piid]) === 1;
    }
  });

  // Port toggles from PIID 16 bitmask
  const portVal = settings['16'];
  if (portVal !== undefined) {
    const v = parseInt(portVal);
    const ports = {c1: 0, c2: 1, c3: 2, a: 3};
    for (const [port, bit] of Object.entries(ports)) {
      const cb = document.querySelector(`input[data-port="${port}"]`);
      const card = document.getElementById(`port-${port}`);
      if (cb) {
        const isOn = (v >> bit) & 1;
        cb.checked = !!isOn;
        if (isOn) { card.classList.add('active'); }
        else { card.classList.remove('active'); }
      }
    }
  }
}

// ============================================================
// Port data display + total power + power bar
// ============================================================
function updatePortData(port, data) {
  // v1.3.8：保留这个入口给非推送场景（设置变更后手工刷新），
  // 推送路径已经改走 dirtyPorts + scheduleRender()
  portDataCache[port] = data;
  dirtyPorts.add(port);
  scheduleRender();
}

function renderPortsDisplay() {
  const c3 = portDataCache.c3;
  const a = portDataCache.a;

  const c3On = !!(c3 && c3.active && (c3.power || 0) > 0);
  const aOn = !!(a && a.active && (a.power || 0) > 0);

  // C3 与 A 同时输出时，合并显示为同一路
  if (c3On && aOn) {
    const mergedPower = (c3.power || 0) + (a.power || 0);
    const mergedVoltage = c3.voltage || a.voltage || 0;
    const mergedCurrent = mergedVoltage > 0 ? (mergedPower / mergedVoltage) : ((c3.current || 0) + (a.current || 0));

    renderPortCard('c3', {
      active: true,
      power: mergedPower,
      voltage: mergedVoltage,
      current: mergedCurrent,
      detailText: `${mergedVoltage.toFixed(1)}V / ${mergedCurrent.toFixed(1)}A (C3+A 合并)`,
    });

    renderPortCard('a', {
      active: true,
      power: mergedPower,
      voltage: mergedVoltage,
      current: mergedCurrent,
      detailText: `已并入 C3 · C3 ${(c3.power || 0).toFixed(1)}W + A ${(a.power || 0).toFixed(1)}W`,
      powerText: '并入',
    });
  } else {
    renderPortCard('c3', c3);
    renderPortCard('a', a);
  }

  renderPortCard('c1', portDataCache.c1);
  renderPortCard('c2', portDataCache.c2);
}

function renderPortCard(port, data) {
  const el = document.getElementById(`portdata-${port}`);
  if (!el) return;

  // v1.3.8：先把目标值算出来，与上次写入完全一致就整块跳过，
  // 不碰 DOM 就不会触发样式重算（原来每条消息都无条件写一遍）
  let pw, cls, dt;
  if (!data) {
    pw = '--'; cls = 'port-power zero'; dt = '未接入';
  } else if (data.active && data.power > 0) {
    pw = data.powerText || `${Number(data.power).toFixed(1)}W`;
    cls = 'port-power';
    dt = data.detailText || `${data.voltage}V / ${data.current}A`;
  } else if (data.active) {
    pw = '0W'; cls = 'port-power zero'; dt = data.detailText || `${data.voltage}V / 待机`;
  } else {
    pw = '--'; cls = 'port-power zero'; dt = '未接入';
  }

  const key = pw + '|' + cls + '|' + dt;
  if (el.dataset.lastKey === key) return;
  el.dataset.lastKey = key;

  const powerEl = el.querySelector('.port-power');
  const detailEl = el.querySelector('.port-detail');
  powerEl.textContent = pw;
  powerEl.className = cls;
  detailEl.textContent = dt;

  // Power bar
  updatePowerBar(port, data ? (data.power || 0) : 0);
}

function updatePowerBar(port, power) {
  const fill = document.getElementById(`bar-${port}`);
  const card = document.getElementById(`port-${port}`);
  if (!fill) return;

  const cfg = POWER_LIMITS.ports[port] || { sceneMax: 100, hardMax: 120 };
  const safePower = Math.max(0, Math.min(Number(power) || 0, cfg.hardMax));
  const pct = Math.min(safePower / cfg.sceneMax, 1) * 100;

  // v1.3.8：变化小于 0.5% 就不动宽度，否则 0.1W 的抖动会不停触发 0.5s 过渡
  const lastPct = Number(fill.dataset.pct);
  if (!Number.isFinite(lastPct) || Math.abs(lastPct - pct) >= 0.5) {
    fill.dataset.pct = String(pct);
    fill.style.transform = `scaleX(${(pct / 100).toFixed(4)})`;
  }
  // Color: green <35%, amber <75%, red >=75%
  const ratio = cfg.sceneMax > 0 ? (safePower / cfg.sceneMax) : 0;
  const bg = ratio >= 0.75 ? 'var(--red)' : (ratio >= 0.35 ? 'var(--amber)' : 'var(--green)');
  if (fill.dataset.bg !== bg) {
    fill.dataset.bg = bg;
    fill.style.background = bg;
  }

  // 超过场景上限时，不再拉长进度条，只增加高光提示
  const shadow = safePower > cfg.sceneMax ? '0 0 10px rgba(248, 113, 113, 0.55)' : 'none';
  if (fill.dataset.shadow !== shadow) {
    fill.dataset.shadow = shadow;
    fill.style.boxShadow = shadow;
  }

  if (card) {
    const cls = ratio >= 0.75 ? 'power-high' : (ratio >= 0.35 ? 'power-mid' : (safePower > 0 ? 'power-low' : ''));
    if (card.dataset.powerCls !== cls) {
      card.dataset.powerCls = cls;
      card.classList.remove('power-low', 'power-mid', 'power-high');
      if (cls) card.classList.add(cls);
    }
  }
}

function updateTotalPower() {
  let total = 0;
  for (const p of Object.values(portDataCache)) {
    if (p && p.power > 0) total += p.power;
  }
  const wrap = document.getElementById('totalPowerWrap');
  const el = document.getElementById('totalPower');
  const flowMask = document.getElementById('energyFlowMask');
  const totalText = total > 0 ? `${total.toFixed(1)}W` : '0W';

  const cfg = POWER_LIMITS.total;
  const safeTotal = Math.max(0, Math.min(total, cfg.hardMax));
  const level = Math.max(0, Math.min(safeTotal / cfg.sceneMax, 1));
  const flowPct = total > 0 ? Math.max(4, level * 100) : 0;
  // 速度只按 1/4 档变化：改 animation-duration 会让动画进度按比例跳一下，
  // 每 0.1W 抖一次就等于每帧都在抖。分档后只在功率跨过 25% 时换一次速度。
  const bucket = Math.round(level * 4) / 4;

  // v1.3.8：整块总功率区域按一个 key 做脏检查。
  // 原来每条消息都要写 4 个 CSS 变量 + 宽度 + 3 个 class，等于逼整棵子树重算样式。
  const key = totalText + '|' + flowPct.toFixed(1) + '|' + bucket
    + '|' + (safeTotal > cfg.sceneMax);
  if (wrap && wrap.dataset.lastKey === key) return;
  if (wrap) wrap.dataset.lastKey = key;

  if (el) el.textContent = totalText;

  if (flowMask) {
    // 遮罩平移用的比例（0~100%），交给 CSS 的 transform 过渡去做动画
    flowMask.style.transform = `translateX(${flowPct.toFixed(2)}%)`;
    const track = document.getElementById('flowTrack');
    const glow = safeTotal > cfg.sceneMax ? '0 0 16px rgba(248, 113, 113, 0.55)' : 'none';
    if (track && track.dataset.glow !== glow) {
      track.dataset.glow = glow;
      track.style.boxShadow = glow;
    }
  }

  if (!wrap) return;
  wrap.classList.toggle('zero', total <= 0);
  wrap.classList.toggle('active', total > 0);
  wrap.classList.toggle('boost', total >= 55);

  // 只有跨档才重写这几个变量，避免每秒重算动画时间
  if (wrap.dataset.bucket !== String(bucket)) {
    wrap.dataset.bucket = String(bucket);
    const flowSpeed = Math.max(0.45, 2.4 - bucket * 1.8);
    const pulseSpeed = Math.max(0.35, 2.6 - bucket * 2.0);
    wrap.style.setProperty('--flow-speed', `${flowSpeed.toFixed(2)}s`);
    wrap.style.setProperty('--pulse-speed', `${pulseSpeed.toFixed(2)}s`);
    wrap.style.setProperty('--flow-bright', (0.55 + bucket * 0.9).toFixed(2));
    wrap.style.setProperty('--tail-alpha', (0.2 + bucket * 0.6).toFixed(2));
  }
}

// ============================================================
// History charts（v1.4.2）
// ------------------------------------------------------------
// 变化点：
// 1) 默认就是「今天 + 按分钟」——进去不用点就能看到当天曲线；
// 2) 同一张图里叠两条线：所选端口的「功率」和全场「总功率」，
//    两者同量纲（W），看「这口占了多少」一眼就够；
// 3) 电压/电流两个指标已下线（图里只需要功率）。
// ============================================================
function localDateStr(d) {
  // 不能用 toISOString()，那是 UTC —— 北京时间 0~8 点会退到昨天
  const t = d || new Date();
  const p = n => String(n).padStart(2, '0');
  return `${t.getFullYear()}-${p(t.getMonth() + 1)}-${p(t.getDate())}`;
}

function localMinuteKey(d) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

function initHistoryPanel() {
  const dateEl = document.getElementById('historyDate');
  const today = localDateStr();
  dateEl.innerHTML = `<option value="${today}">${today}</option>`;

  // 默认按分钟
  document.getElementById('historyGranularity').value = 'minute';

  document.getElementById('historyPort').addEventListener('change', () => loadHistoryData());
  document.getElementById('historyGranularity').addEventListener('change', () => loadHistoryData());
  dateEl.addEventListener('change', () => loadHistoryData());

  loadHistoryDates().then(() => loadHistoryData());
}

async function loadHistoryDates() {
  const data = await apiCall('GET', '/api/history/dates');
  if (!data.ok || !Array.isArray(data.dates)) return;

  const dateEl = document.getElementById('historyDate');
  const prev = dateEl.value;
  dateEl.innerHTML = data.dates.map(d => `<option value="${d}">${d}</option>`).join('');
  if (prev && data.dates.includes(prev)) dateEl.value = prev;
}

function historyBucketLabel(ts, granularity) {
  const s = String(ts || '');
  if (granularity === 'second') return s.slice(11, 19);
  if (granularity === 'minute') return s.slice(11, 16);
  if (granularity === 'hour') return `${s.slice(11, 13)}:00`;
  return s;
}

// 分钟粒度下把时间轴补成连续的一分钟一格。
// 后端只在「数值变化」时才写一条，直接按记录画点会把空白分钟压掉，
// 曲线就会挤在一起、横向比例失真。
function buildHistoryAxis(rowsList, granularity) {
  const set = new Set();
  rowsList.forEach(rows => rows.forEach(r => set.add(String(r.ts || ''))));
  const keys = [...set].filter(Boolean).sort();
  if (!keys.length) return [];
  if (granularity !== 'minute' || keys.length < 2) return keys;

  const axis = [];
  const endKey = keys[keys.length - 1];
  let t = new Date(keys[0]);
  // 上限兜底：一天最多 1440 格，超过就别硬撑（异常数据不该卡死页面）
  for (let i = 0; i < 3000; i++) {
    const key = localMinuteKey(t);
    axis.push(key);
    if (key >= endKey) break;
    t = new Date(t.getTime() + 60000);
  }
  return axis;
}

// 缺口沿用上一条读数：没记录 = 这一分钟没变化，不是 0。
// 但只续一小段（maxGap 格），再长就当「没采到数据」断开 ——
// 否则一次断电十几个小时，曲线会被拉成一条假的水平线。
function fillHistorySeries(rows, axis, maxGap) {
  const byTs = new Map();
  rows.forEach(r => byTs.set(String(r.ts || ''), Number(r.power || 0)));
  const out = [];
  let last = null;
  let lastIdx = -1;
  for (let i = 0; i < axis.length; i++) {
    const ts = axis[i];
    if (byTs.has(ts)) {
      last = byTs.get(ts);
      lastIdx = i;
      out.push(last);
    } else {
      out.push(last !== null && i - lastIdx <= maxGap ? last : null);
    }
  }
  return out;
}

// 时间粒度 → 允许连续沿用多少格
function historyMaxGap(granularity) {
  if (granularity === 'second') return 120;
  if (granularity === 'minute') return 10;
  if (granularity === 'hour') return 3;
  return Infinity;
}

async function loadHistoryData() {
  const date = document.getElementById('historyDate').value;
  const port = document.getElementById('historyPort').value;
  const granularity = document.getElementById('historyGranularity').value;
  if (!port || !granularity) return;

  const qs = extra => `/api/history?date=${encodeURIComponent(date || '')}`
    + `&port=${encodeURIComponent(extra)}&granularity=${encodeURIComponent(granularity)}`;

  // 总功率和端口功率并发取，两个请求互不依赖
  const wantTotal = port !== 'total';
  const [portRes, totalRes] = await Promise.all([
    apiCall('GET', qs(port)),
    wantTotal ? apiCall('GET', qs('total')) : Promise.resolve(null),
  ]);
  if (!portRes || !portRes.ok) return;

  const portRows = Array.isArray(portRes.records) ? portRes.records : [];
  const totalRows = totalRes && totalRes.ok && Array.isArray(totalRes.records) ? totalRes.records : [];
  if (!portRows.length && !totalRows.length) {
    renderHistoryChart([], [], '功率 (W) · 暂无数据');
    return;
  }

  const axis = buildHistoryAxis(wantTotal ? [portRows, totalRows] : [portRows], granularity);
  const labels = axis.map(ts => historyBucketLabel(ts, granularity));

  const granularityName = {
    second: '秒', minute: '分钟', hour: '小时',
    day: '天', month: '月', year: '年',
  }[granularity] || '分钟';
  const withDate = granularity === 'second' || granularity === 'minute' || granularity === 'hour';

  const datasets = [];
  const maxGap = historyMaxGap(granularity);
  if (port !== 'total') {
    // 所选端口的功率（绿）
    datasets.push({
      label: `${port.toUpperCase()} 功率 (W)`,
      data: fillHistorySeries(portRows, axis, maxGap),
      borderColor: '#22c55e',
    });
    // 全场总功率（蓝），作为对照基线
    datasets.push({
      label: '总功率 (W)',
      data: fillHistorySeries(totalRows, axis, maxGap),
      borderColor: '#60a5fa',
    });
  } else {
    // 选「总功率」时就只画这一条，不再叠一条重复的
    datasets.push({
      label: '总功率 (W)',
      data: fillHistorySeries(portRows, axis, maxGap),
      borderColor: '#22c55e',
    });
  }

  const scope = port === 'total' ? '总功率' : `${port.toUpperCase()} vs 总功率`;
  const title = `功率 (W) · ${scope} · 按${granularityName}${withDate && date ? ` · ${date}` : ''}`;
  renderHistoryChart(labels, datasets, title);
}

function renderHistoryChart(labels, datasets, title) {
  const el = document.getElementById('historyChart');
  if (!el || !window.Chart) return;

  const titleEl = document.getElementById('historyChartTitle');
  if (titleEl) titleEl.textContent = title;

  let maxV = 0;
  datasets.forEach(d => d.data.forEach(v => {
    if (typeof v === 'number' && v > maxV) maxV = v;
  }));
  const suggestedMax = maxV > 0 ? Number((maxV * 1.15).toFixed(2)) : 1;

  const styled = datasets.map(d => ({
    ...d,
    borderWidth: 2,
    tension: 0.18,
    pointRadius: 0,
    pointHitRadius: 10,
    pointHoverRadius: 3,
    fill: false,
    // 断点就是断点：长缺口不应该被一条直线"补"过去
    spanGaps: false,
    borderJoinStyle: 'round',
  }));

  if (!historyChart) {
    historyChart = new Chart(el.getContext('2d'), {
      type: 'line',
      data: { labels, datasets: styled },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        layout: { padding: { bottom: 8, top: 2 } },
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: {
            display: datasets.length > 1,
            position: 'top',
            align: 'end',
            labels: {
              color: '#94a3b8',
              usePointStyle: true,
              pointStyle: 'line',
              boxWidth: 18,
              boxHeight: 2,
              padding: 14,
              font: { size: 11 },
            },
          },
          tooltip: {
            enabled: true,
            callbacks: {
              label: ctx => {
                const v = ctx.parsed.y;
                return v === null || v === undefined
                  ? `${ctx.dataset.label}: —`
                  : `${ctx.dataset.label}: ${Number(v).toFixed(1)}W`;
              },
            },
          },
        },
        scales: {
          x: {
            ticks: {
              color: '#94a3b8',
              maxTicksLimit: 7,
              maxRotation: 0,
              minRotation: 0,
              autoSkip: true,
              callback: function(value) {
                const labelValue = this.getLabelForValue(value) || '';
                if (labelValue.includes(':') && labelValue.length > 5) {
                  return labelValue.slice(0, 5);
                }
                return labelValue;
              },
            },
            grid: { color: '#2a2d3a' },
          },
          y: {
            beginAtZero: true,
            suggestedMax,
            ticks: { color: '#94a3b8' },
            grid: { color: '#2a2d3a' },
          },
        },
      },
    });
    return;
  }

  historyChart.data.labels = labels;
  historyChart.data.datasets = styled;
  historyChart.options.plugins.legend.display = datasets.length > 1;
  historyChart.options.scales.y.suggestedMax = suggestedMax;
  historyChart.update('none');
}

// ============================================================
// API calls
// ============================================================
async function apiCall(method, path, body) {
  try {
    const resp = await fetch(path, {
      method,
      headers: {'Content-Type': 'application/json'},
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await resp.json();
    if (!data.ok && data.error) {
      showToast(data.error, 'error');
    }
    return data;
  } catch (e) {
    showToast('网络错误', 'error');
    return {ok: false};
  }
}

async function toggleConnection() {
  if (connectionState === 'READY') {
    await apiCall('POST', '/api/disconnect');
    showToast('已断开连接', 'info');
  } else if (connectionState === 'DISCONNECTED') {
    updateConnectionState('CONNECTING');
    const result = await apiCall('POST', '/api/connect');
    if (result.ok) {
      showToast('设备已连接', 'success');
    }
  }
}

async function setSetting(piid, value, btnEl) {
  if (updatingFromServer) return;
  haptic();

  // Optimistic update: immediately switch UI
  const prevSettings = {...settings};
  if (btnEl && btnEl.classList.contains('seg-btn')) {
    // Segmented button: activate clicked, deactivate siblings
    const group = btnEl.parentElement;
    group.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
    btnEl.classList.add('active');
    btnEl.classList.add('sending');
  }
  settings[String(piid)] = value;

  const result = await apiCall('POST', '/api/set', {piid, value});

  if (!result.ok) {
    // Rollback on failure
    settings = prevSettings;
    renderSettings();
  } else {
    // Remove sending state
    if (btnEl) btnEl.classList.remove('sending');
  }
  // No success toast for settings — optimistic UI is enough
}

async function togglePort(port, isOn) {
  if (updatingFromServer) return;
  haptic();
  const result = await apiCall('POST', '/api/port', {port, action: isOn ? 'on' : 'off'});
  if (result.ok) {
    showToast(`${port.toUpperCase()} 已${isOn ? '开启' : '关闭'}`, 'success');
  }
}

async function setTimerPreset(port, minutes) {
  haptic();
  const result = await apiCall('POST', '/api/timer', {port, minutes});
  if (result.ok) {
    showToast(`${port.toUpperCase()} 倒计时 ${minutes} 分钟`, 'success');
  }
}

async function setTimer(port) {
  const input = document.getElementById(`timer-${port}`);
  const minutes = parseInt(input.value) || 0;
  if (minutes <= 0) return;
  haptic();
  const result = await apiCall('POST', '/api/timer', {port, minutes});
  if (result.ok) {
    showToast(`${port.toUpperCase()} 倒计时 ${minutes} 分钟`, 'success');
    input.value = '';
  }
}

async function refreshSettings() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  btn.disabled = true;
  const result = await apiCall('POST', '/api/refresh');
  btn.classList.remove('spinning');
  btn.disabled = false;
  if (result.ok) {
    showToast('已刷新', 'info');
  }
}

// ============================================================
// Toast notifications
// ============================================================
function showToast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(100%)';
    toast.style.transition = 'all 0.3s';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

// ============================================================
// 对外控制通道（v1.3.8）
// ------------------------------------------------------------
// 桌面壳子（desktop/manager.py）在窗口隐藏/显示时通过 evaluate_js 调它，
// 把整页画图彻底停掉 —— 收进托盘不等于停止渲染，这条通道就是干这个的。
// 注意：不要和引导页的 window.__ctl 混用，那个只存在于 console_host.html。
// ============================================================
window.__ck = {
  setPaused: function (v) {
    const root = document.documentElement;
    root.classList.toggle('viz-paused', !!v);
    if (!v) {
      // 恢复可见：补一次全量，避免停在隐藏期间的旧数值
      dirtyPorts.add('c1'); dirtyPorts.add('c2');
      dirtyPorts.add('c3'); dirtyPorts.add('a');
      renderPortsDisplay();
      updateTotalPower();
    }
  }
};

// 兜底：Python 那边万一没调到，页面自己也按可见性暂停
document.addEventListener('visibilitychange', () => {
  window.__ck.setPaused(document.visibilityState === 'hidden');
});

// ============================================================
// Init
// ============================================================
window.addEventListener('load', () => {
  connectWebSocket();
  initHistoryPanel();
  // Fetch initial status in case WS is slow
  fetch('/api/status').then(r => r.json()).then(data => {
    updateConnectionState(data.state);
    if (data.settings) {
      settings = data.settings;
      renderSettings();
    }
  }).catch(() => {});
});
</script>
