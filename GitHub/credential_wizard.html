<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置设备凭据</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --card-border: #2a2d3a;
    --primary: #3b82f6;
    --primary-hover: #2563eb;
    --green: #22c55e;
    --red: #ef4444;
    --amber: #f59e0b;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --text-bright: #f8fafc;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }
  header {
    padding: 18px 22px 14px;
    border-bottom: 1px solid var(--card-border);
  }
  header h1 { margin: 0 0 4px; font-size: 16px; font-weight: 600; color: var(--text-bright); }
  header p { margin: 0; font-size: 12px; color: var(--text-dim); }

  main { flex: 1; overflow-y: auto; padding: 16px 22px 8px; }
  main::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-thumb { background: #333a4d; border-radius: 4px; }

  .step { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 12px; color: var(--text-dim); }
  .step b {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 50%;
    background: #23304a; color: #93b4f5; font-size: 11px; font-weight: 600;
  }

  textarea {
    width: 100%; height: 132px; resize: none;
    background: var(--card); color: var(--text);
    border: 1px solid var(--card-border); border-radius: var(--radius);
    padding: 11px 12px; font-size: 12px; line-height: 1.6;
    font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
    outline: none;
  }
  textarea:focus { border-color: var(--primary); }
  textarea::placeholder { color: #4d5872; }

  .tools { display: flex; gap: 8px; margin-top: 8px; }
  .btn {
    flex: 0 0 auto;
    background: var(--card); color: var(--text);
    border: 1px solid var(--card-border); border-radius: 8px;
    padding: 7px 12px; font-size: 12px; cursor: pointer;
    transition: border-color .15s, color .15s;
    font-family: inherit;
  }
  .btn:hover { border-color: var(--primary); color: var(--text-bright); }
  .btn:disabled { opacity: .45; cursor: default; }

  .fields { margin-top: 14px; display: grid; gap: 8px; }
  .field {
    display: grid; grid-template-columns: 62px 1fr 18px;
    align-items: center; gap: 10px;
  }
  .field label { color: var(--text-dim); font-size: 12px; }
  .field input {
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 8px; color: var(--text);
    padding: 8px 10px; font-size: 12px;
    font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
    outline: none; width: 100%;
  }
  .field input.ok { border-color: var(--green); color: var(--text-bright); }
  .field input.bad { border-color: var(--red); }
  .field .mark { text-align: center; font-size: 13px; color: #3f4a63; }
  .field .mark.ok { color: var(--green); }
  .field .mark.bad { color: var(--red); }

  .msg {
    margin-top: 12px; min-height: 34px;
    font-size: 12px; line-height: 1.5;
    color: var(--text-dim);
  }
  .msg.err { color: #fca5a5; }
  .msg.ok { color: #86efac; }
  .msg ul { margin: 4px 0 0; padding-left: 16px; }

  footer {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 22px 16px; border-top: 1px solid var(--card-border);
  }
  footer .hint { flex: 1; font-size: 11px; color: #5c6884; line-height: 1.45; }
  .btn-primary {
    background: var(--primary); border-color: var(--primary);
    color: #fff; font-weight: 500; padding: 8px 20px;
  }
  .btn-primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn-primary:disabled { background: #2a3448; border-color: #2a3448; color: #6b7794; }
</style>
</head>
<body>
<header>
  <h1>设置设备凭据</h1>
  <p>填好 MAC / TOKEN / BLE KEY 这三项，控制台才能连上充电器。</p>
</header>

<main>
  <div class="step"><b>1</b> 把取码窗口里的内容整段粘进来</div>
  <textarea id="paste" placeholder="把取码窗口里的内容整段粘进来，例如：
mac: 9C:11:22:33:44:55
token: 24 位十六进制
blekey: 32 位十六进制"></textarea>

  <div class="tools">
    <button class="btn" id="btnExtract">打开取码工具</button>
    <button class="btn" id="btnFile">从文件导入…</button>
  </div>

  <div class="step" style="margin-top:16px"><b>2</b> 识别结果（自动填充）</div>
  <div class="fields">
    <div class="field">
      <label>MAC</label>
      <input id="fMac" readonly placeholder="—">
      <span class="mark" id="mMac">·</span>
    </div>
    <div class="field">
      <label>TOKEN</label>
      <input id="fToken" readonly placeholder="—">
      <span class="mark" id="mToken">·</span>
    </div>
    <div class="field">
      <label>BLE KEY</label>
      <input id="fKey" readonly placeholder="—">
      <span class="mark" id="mKey">·</span>
    </div>
  </div>

  <div class="msg" id="msg">还没有识别到内容。</div>
</main>

<footer>
  <div class="hint">凭据只保存在本机配置目录，不会上传到任何地方。</div>
  <button class="btn" id="btnCancel">取消</button>
  <button class="btn btn-primary" id="btnSave" disabled>保存</button>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const state = { values: null, ok: false };

function setMark(id, ok, filled) {
  const el = $(id);
  el.classList.toggle('ok', ok);
  el.classList.toggle('bad', filled && !ok);
  el.textContent = ok ? '✓' : (filled ? '✗' : '·');
}

function setField(inputId, markId, value, ok) {
  const input = $(inputId);
  input.value = value || '';
  input.classList.toggle('ok', !!ok);
  input.classList.toggle('bad', !!value && !ok);
  setMark(markId, ok, !!value);
}

function setMsg(text, kind) {
  const el = $('msg');
  el.className = 'msg' + (kind ? ' ' + kind : '');
  el.innerHTML = text;
}

async function doParse(text) {
  if (!text || !text.trim()) {
    state.values = null; state.ok = false;
    setField('fMac', 'mMac', '', false);
    setField('fToken', 'mToken', '', false);
    setField('fKey', 'mKey', '', false);
    setMsg('还没有识别到内容。');
    $('btnSave').disabled = true;
    return;
  }
  let res;
  try {
    res = await window.pywebview.api.parse(text);
  } catch (e) {
    setMsg('解析失败：' + e, 'err');
    return;
  }
  state.values = res.values;
  state.ok = res.ok;

  setField('fMac', 'mMac', res.display.mac, res.parts.mac);
  setField('fToken', 'mToken', res.display.token, res.parts.token);
  setField('fKey', 'mKey', res.display.ble_key, res.parts.ble_key);

  $('btnSave').disabled = !res.ok;
  if (res.ok) {
    setMsg('三项都齐了，点「保存」即可。', 'ok');
  } else if (res.errors && res.errors.length) {
    setMsg('还需要处理：<ul>' + res.errors.map(e => '<li>' + e + '</li>').join('') + '</ul>', 'err');
  } else {
    setMsg('没识别出完整的三项。', 'err');
  }
}

let timer = null;
$('paste').addEventListener('input', (e) => {
  clearTimeout(timer);
  const text = e.target.value;
  timer = setTimeout(() => doParse(text), 180);
});

function applyExtract(st) {
  state.values = st.values;
  state.ok = !!st.ok;
  setField('fMac', 'mMac', st.display.mac, st.parts.mac);
  setField('fToken', 'mToken', st.display.token, st.parts.token);
  setField('fKey', 'mKey', st.display.ble_key, st.parts.ble_key);
  $('btnSave').disabled = !state.ok;
  if (state.ok) {
    setMsg('已从取码结果识别到三项，点「保存」写进配置。', 'ok');
  } else {
    setMsg('还需要处理：<ul>' + (st.errors || []).map(e => '<li>' + e + '</li>').join('') + '</ul>', 'err');
  }
}

let pollTimer = null;
function startPoll() {
  if (pollTimer) return;
  $('btnSave').disabled = true;
  setMsg('取码窗口已打开，扫码完成后这里会自动识别…');
  pollTimer = setInterval(async () => {
    let st;
    try { st = await window.pywebview.api.poll_extract(); }
    catch (e) { return; }
    if (st.running) return;
    clearInterval(pollTimer);
    pollTimer = null;
    $('btnExtract').disabled = false;
    if (st.done && st.values) {
      $('paste').value = [
        'mac: ' + st.values.mac,
        'token: ' + st.values.token,
        'blekey: ' + st.values.ble_key,
      ].join('\n');
      applyExtract(st);
    } else {
      setMsg(st.error || '取码没有拿到结果，可以重试或手动粘贴。', 'err');
    }
  }, 1200);
}

$('btnExtract').addEventListener('click', async () => {
  $('btnExtract').disabled = true;
  let res;
  try { res = await window.pywebview.api.open_extractor(); }
  catch (e) { res = { ok: false, error: String(e) }; }
  if (!res || !res.ok) {
    setMsg((res && res.error) || '打不开取码工具', 'err');
    $('btnExtract').disabled = false;
    return;
  }
  startPoll();
});

$('btnFile').addEventListener('click', async () => {
  let res;
  try { res = await window.pywebview.api.pick_file(); }
  catch (e) { setMsg('读文件失败：' + e, 'err'); return; }
  if (!res || res.cancelled) return;
  if (res.error) { setMsg(res.error, 'err'); return; }
  $('paste').value = res.text;
  doParse(res.text);
});

$('btnSave').addEventListener('click', async () => {
  if (!state.ok || !state.values) return;
  $('btnSave').disabled = true;
  $('btnCancel').disabled = true;
  let res;
  try { res = await window.pywebview.api.save(state.values); }
  catch (e) { setMsg('保存失败：' + e, 'err'); $('btnSave').disabled = false; $('btnCancel').disabled = false; return; }
  if (!res || !res.ok) {
    setMsg((res && res.error) || '保存失败', 'err');
    $('btnSave').disabled = false;
    $('btnCancel').disabled = false;
    return;
  }
  setMsg('已保存到 ' + res.path + '，控制台正在重启…', 'ok');
  setTimeout(() => window.pywebview.api.close(), 1200);
});

$('btnCancel').addEventListener('click', () => window.pywebview.api.close());

window.addEventListener('pywebviewready', async () => {
  try {
    const st = await window.pywebview.api.status();
    if (st && st.configured) {
      $('paste').value = st.seed || '';
      setMsg('当前已配置：' + st.display.mac + '。要更换就粘贴新的三项。');
    }
  } catch (e) { /* 首次运行没有现成配置，忽略 */ }
});
</script>
</body>
</html>
