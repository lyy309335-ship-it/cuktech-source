<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>连接充电器</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --card-border: #2a2d3a;
    --primary: #3b82f6;
    --primary-hover: #2563eb;
    --green: #22c55e;
    --red: #ef4444;
    --amber: #f59e0b;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --text-bright: #f8fafc;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }
  header {
    padding: 18px 22px 14px;
    border-bottom: 1px solid var(--card-border);
  }
  header h1 { margin: 0 0 4px; font-size: 16px; font-weight: 600; color: var(--text-bright); }
  header p { margin: 0; font-size: 12px; color: var(--text-dim); }

  main { flex: 1; overflow-y: auto; padding: 16px 22px 8px; }
  main::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-thumb { background: #333a4d; border-radius: 4px; }

  /* ---------------- 扫码区 ---------------- */
  .qr-stage { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 4px 0 8px; }

  .qr-box {
    width: 232px; height: 232px;
    background: #fff; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 26px rgba(0,0,0,.45);
    position: relative;
    overflow: hidden;
  }
  .qr-box img { width: 100%; height: 100%; object-fit: contain; display: none; }
  .qr-box img.show { display: block; }

  .qr-skeleton {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; color: #6b7794; font-size: 12px;
  }
  .qr-box.showing .qr-skeleton { display: none; }
  .qr-ok { font-size: 76px; color: var(--green); line-height: 1; }
  .spinner {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2.5px solid #dfe4ee; border-top-color: var(--primary);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .qr-status { font-size: 13px; color: var(--text); text-align: center; min-height: 20px; }
  .qr-status.dim { color: var(--text-dim); }
  .qr-status.ok { color: var(--green); }
  .qr-status.err { color: #fca5a5; }
  .qr-sub { font-size: 11.5px; color: #5c6884; text-align: center; line-height: 1.6; }

  .steps { display: grid; gap: 6px; margin: 2px 0 0; }
  .step-line { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; color: var(--text-dim); line-height: 1.55; }
  .step-line b {
    flex: 0 0 auto; margin-top: 1px;
    display: inline-flex; align-items: center; justify-content: center;
    width: 17px; height: 17px; border-radius: 50%;
    background: #23304a; color: #93b4f5; font-size: 10.5px; font-weight: 600;
  }

  /* ---------------- 结果区 ---------------- */
  .result {
    margin-top: 14px; padding-top: 14px; border-top: 1px dashed #262b38;
    display: none;
  }
  .result.show { display: block; }
  .fields { display: grid; gap: 8px; }
  .field { display: grid; grid-template-columns: 62px 1fr 18px; align-items: center; gap: 10px; }
  .field label { color: var(--text-dim); font-size: 12px; }
  .field input {
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 8px; color: var(--text);
    padding: 8px 10px; font-size: 12px;
    font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
    outline: none; width: 100%;
  }
  .field input.ok { border-color: var(--green); color: var(--text-bright); }
  .field .mark { text-align: center; font-size: 13px; color: #3f4a63; }
  .field .mark.ok { color: var(--green); }

  /* ---------------- 手动兜底 ---------------- */
  .manual { margin-top: 14px; display: none; }
  .manual.show { display: block; }
  textarea {
    width: 100%; height: 118px; resize: none;
    background: var(--card); color: var(--text);
    border: 1px solid var(--card-border); border-radius: var(--radius);
    padding: 11px 12px; font-size: 12px; line-height: 1.6;
    font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
    outline: none;
  }
  textarea:focus { border-color: var(--primary); }
  textarea::placeholder { color: #4d5872; }

  .tools { display: flex; gap: 8px; margin-top: 8px; }
  .btn {
    flex: 0 0 auto;
    background: var(--card); color: var(--text);
    border: 1px solid var(--card-border); border-radius: 8px;
    padding: 7px 12px; font-size: 12px; cursor: pointer;
    transition: border-color .15s, color .15s;
    font-family: inherit;
  }
  .btn:hover { border-color: var(--primary); color: var(--text-bright); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn-link {
    background: none; border: none; color: #7d8cab;
    font-size: 11.5px; cursor: pointer; padding: 2px 0;
    font-family: inherit; text-decoration: underline;
  }
  .btn-link:hover { color: var(--primary); }

  .msg { margin-top: 12px; min-height: 30px; font-size: 12px; line-height: 1.5; color: var(--text-dim); }
  .msg.err { color: #fca5a5; }
  .msg.ok { color: #86efac; }
  .msg ul { margin: 4px 0 0; padding-left: 16px; }

  footer {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 22px 16px; border-top: 1px solid var(--card-border);
  }
  footer .hint { flex: 1; font-size: 11px; color: #5c6884; line-height: 1.45; }
  .btn-primary {
    background: var(--primary); border-color: var(--primary);
    color: #fff; font-weight: 500; padding: 8px 20px;
  }
  .btn-primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn-primary:disabled { background: #2a3448; border-color: #2a3448; color: #6b7794; }
</style>
</head>
<body>
<header>
  <h1>连接充电器</h1>
  <p>用米家 App 扫一下下面的二维码，设备信息会自动填进来。</p>
</header>

<main>
  <!-- 扫码主通道 -->
  <div class="qr-stage" id="qrStage">
    <div class="qr-box" id="qrBox">
      <img id="qrImg" alt="登录二维码">
      <div class="qr-skeleton">
        <div class="spinner"></div>
        <span id="qrSkeletonText">正在生成二维码…</span>
      </div>
    </div>
    <div class="qr-status dim" id="qrStatus">正在准备…</div>
    <div class="qr-sub" id="qrSub">二维码会每隔一段时间自动刷新，不用管它。</div>
  </div>

  <div class="steps" id="qrSteps">
    <div class="step-line"><b>1</b><span>打开手机上的米家 App，点右上角「扫一扫」</span></div>
    <div class="step-line"><b>2</b><span>扫描上面的二维码，然后在手机上点「确认登录」</span></div>
    <div class="step-line"><b>3</b><span>扫码完成后这里会自动填好并保存，不用手动输入</span></div>
  </div>

  <!-- 识别结果 -->
  <div class="result" id="result">
    <div class="fields">
      <div class="field">
        <label>MAC</label>
        <input id="fMac" readonly placeholder="—">
        <span class="mark" id="mMac">·</span>
      </div>
      <div class="field">
        <label>TOKEN</label>
        <input id="fToken" readonly placeholder="—">
        <span class="mark" id="mToken">·</span>
      </div>
      <div class="field">
        <label>BLE KEY</label>
        <input id="fKey" readonly placeholder="—">
        <span class="mark" id="mKey">·</span>
      </div>
    </div>
  </div>

  <!-- 手动兜底 -->
  <div class="manual" id="manual">
    <textarea id="paste" placeholder="把取码结果整段粘进来，例如：
mac: 9C:11:22:33:44:55
token: 24 位十六进制
blekey: 32 位十六进制"></textarea>
    <div class="tools">
      <button class="btn" id="btnFile">从文件导入…</button>
      <button class="btn" id="btnConsole">用命令行取码</button>
    </div>
  </div>

  <div class="msg" id="msg"></div>
</main>

<footer>
  <div class="hint">
    扫码只在小米服务器上完成登录，凭据只保存在本机，不会上传到任何地方。<br>
    <button class="btn-link" id="btnManualToggle">扫码不成功？手动填写</button>
  </div>
  <button class="btn" id="btnCancel">取消</button>
  <button class="btn btn-primary" id="btnSave" disabled>保存</button>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const state = { values: null, ok: false, autoSaved: false };

/* ---------------- 通用 ---------------- */
function setMark(id, ok, filled) {
  const el = $(id);
  el.classList.toggle('ok', ok);
  el.textContent = ok ? '✓' : '·';
}

function setField(inputId, markId, value, ok) {
  const input = $(inputId);
  input.value = value || '';
  input.classList.toggle('ok', !!ok);
  setMark(markId, ok, !!value);
}

function setMsg(text, kind) {
  const el = $('msg');
  el.className = 'msg' + (kind ? ' ' + kind : '');
  el.innerHTML = text;
}

function setQrStatus(text, kind) {
  const el = $('qrStatus');
  el.className = 'qr-status' + (kind ? ' ' + kind : '');
  el.textContent = text;
}

function fillValues(display, parts) {
  setField('fMac', 'mMac', display.mac, parts.mac);
  setField('fToken', 'mToken', display.token, parts.token);
  setField('fKey', 'mKey', display.ble_key, parts.ble_key);
  $('result').classList.add('show');
}

/* ---------------- 自动保存 ---------------- */
async function autoSave() {
  if (state.autoSaved || !state.ok || !state.values) return;
  state.autoSaved = true;
  let res;
  try { res = await window.pywebview.api.save(state.values); }
  catch (e) { res = { ok: false, error: String(e) }; }
  if (!res || !res.ok) {
    state.autoSaved = false;
    setMsg('自动保存失败：' + ((res && res.error) || '未知原因') + '，请点「保存」重试。', 'err');
    $('btnSave').disabled = false;
    return;
  }
  setQrStatus('已连接，正在启动控制台…', 'ok');
  $('qrSub').textContent = '设备信息已写入本机配置。';
  setMsg('已保存到 ' + res.path, 'ok');
  setTimeout(() => window.pywebview.api.close(), 1600);
}

/* ---------------- 二维码轮询 ---------------- */
let qrTimer = null;
let missCount = 0;

async function tickQr() {
  let f;
  try { f = await window.pywebview.api.qr_frame(); }
  catch (e) { return; }

  if (f.phase === 'done') {
    clearInterval(qrTimer); qrTimer = null;
    let st;
    try { st = await window.pywebview.api.poll_extract(); } catch (e) { st = null; }
    if (st && st.values) {
      state.values = st.values;
      state.ok = !!st.ok;
      fillValues(st.display, st.parts);
      $('qrImg').classList.remove('show');
      $('qrBox').classList.add('showing');
      $('qrSkeletonText').textContent = '';
      const sk = document.querySelector('.qr-skeleton');
      if (sk) sk.style.display = 'none';
      $('qrBox').insertAdjacentHTML('beforeend', '<div class="qr-ok">✓</div>');
      setQrStatus('扫码成功，正在写入配置…', 'ok');
      $('qrSteps').style.display = 'none';
      if (state.ok) { autoSave(); } else {
        setMsg('识别到了设备，但格式校验没通过：<ul>' +
          (st.errors || []).map(e => '<li>' + e + '</li>').join('') + '</ul>', 'err');
        $('btnSave').disabled = false;
      }
    } else {
      setQrStatus('取码完成，但没读到结果', 'err');
      setMsg('可以重试，或用下方「手动填写」。', 'err');
      showManual();
    }
    return;
  }

  if (f.phase === 'error') {
    clearInterval(qrTimer); qrTimer = null;
    setQrStatus('取码失败', 'err');
    setMsg((f.error || '取码工具异常退出') + '，可以重试或用手动填写。', 'err');
    showManual();
    return;
  }

  if (f.phase === 'qrcode') {
    missCount = 0;
    if (f.png) {
      $('qrImg').src = 'data:image/png;base64,' + f.png;
      $('qrImg').classList.add('show');
      $('qrBox').classList.add('showing');
      setQrStatus('用米家 App 扫一扫上面的二维码', '');
      $('qrSub').textContent = '扫完记得在手机上点「确认登录」，不点的话二维码会过期。';
    }
    $('qrSkeletonText').textContent = '正在生成二维码…';
    return;
  }

  // phase === 'starting'
  missCount += 1;
  const waited = f.elapsed || 0;
  if (missCount > 8) {
    $('qrSkeletonText').textContent = '二维码服务还没起来…';
    setQrStatus('正在等待取码工具启动（' + waited + ' 秒）', 'dim');
  }
}

function startQr() {
  $('qrBox').classList.remove('showing');
  $('qrImg').classList.remove('show');
  setQrStatus('正在准备…', 'dim');
  setMsg('');
  if (qrTimer) clearInterval(qrTimer);
  qrTimer = setInterval(tickQr, 600);
}

async function launchQr() {
  let res;
  try { res = await window.pywebview.api.open_extractor(true); }
  catch (e) { res = { ok: false, error: String(e) }; }
  if (!res || !res.ok) {
    setQrStatus('打不开取码工具', 'err');
    setMsg((res && res.error) || '取码工具启动失败', 'err');
    showManual();
    return;
  }
  startQr();
}

/* ---------------- 手动兜底 ---------------- */
function showManual() {
  $('manual').classList.add('show');
}

$('btnManualToggle').addEventListener('click', () => {
  if (qrTimer) { clearInterval(qrTimer); qrTimer = null; }
  $('qrStage').style.display = 'none';
  $('qrSteps').style.display = 'none';
  showManual();
  $('paste').focus();
});

let parseTimer = null;
$('paste').addEventListener('input', (e) => {
  clearTimeout(parseTimer);
  const text = e.target.value;
  parseTimer = setTimeout(async () => {
    if (!text.trim()) return;
    let res;
    try { res = await window.pywebview.api.parse(text); }
    catch (err) { setMsg('解析失败：' + err, 'err'); return; }
    state.values = res.values;
    state.ok = res.ok;
    fillValues(res.display, res.parts);
    $('btnSave').disabled = !res.ok;
    if (res.ok) {
      setMsg('三项都齐了，点「保存」即可。', 'ok');
    } else if (res.errors && res.errors.length) {
      setMsg('还需要处理：<ul>' + res.errors.map(x => '<li>' + x + '</li>').join('') + '</ul>', 'err');
    } else {
      setMsg('没识别出完整的三项。', 'err');
    }
  }, 180);
});

$('btnFile').addEventListener('click', async () => {
  let res;
  try { res = await window.pywebview.api.pick_file(); }
  catch (e) { setMsg('读文件失败：' + e, 'err'); return; }
  if (!res || res.cancelled) return;
  if (res.error) { setMsg(res.error, 'err'); return; }
  $('paste').value = res.text;
  $('paste').dispatchEvent(new Event('input'));
});

$('btnConsole').addEventListener('click', async () => {
  let res;
  try { res = await window.pywebview.api.open_extractor(false); }
  catch (e) { res = { ok: false, error: String(e) }; }
  if (!res || !res.ok) { setMsg((res && res.error) || '打不开取码工具', 'err'); return; }
  setMsg('取码窗口已打开，扫完会自动识别，也可以把结果粘到上面。');
  pollConsole();
});

let consoleTimer = null;
function pollConsole() {
  if (consoleTimer) return;
  consoleTimer = setInterval(async () => {
    let st;
    try { st = await window.pywebview.api.poll_extract(); } catch (e) { return; }
    if (st.running) return;
    clearInterval(consoleTimer); consoleTimer = null;
    if (st.done && st.values) {
      state.values = st.values;
      state.ok = !!st.ok;
      fillValues(st.display, st.parts);
      $('btnSave').disabled = !state.ok;
      $('paste').value = [
        'mac: ' + st.values.mac,
        'token: ' + st.values.token,
        'blekey: ' + st.values.ble_key,
      ].join('\n');
      if (state.ok) setMsg('已识别到三项，点「保存」写进配置。', 'ok');
      else setMsg('还需要处理：<ul>' + (st.errors || []).map(e => '<li>' + e + '</li>').join('') + '</ul>', 'err');
    } else {
      setMsg(st.error || '取码没有拿到结果，可以手动粘贴。', 'err');
    }
  }, 1200);
}

/* ---------------- 底部按钮 ---------------- */
$('btnSave').addEventListener('click', async () => {
  if (!state.ok || !state.values) return;
  $('btnSave').disabled = true;
  $('btnCancel').disabled = true;
  let res;
  try { res = await window.pywebview.api.save(state.values); }
  catch (e) {
    setMsg('保存失败：' + e, 'err');
    $('btnSave').disabled = false; $('btnCancel').disabled = false; return;
  }
  if (!res || !res.ok) {
    setMsg((res && res.error) || '保存失败', 'err');
    $('btnSave').disabled = false; $('btnCancel').disabled = false; return;
  }
  setMsg('已保存到 ' + res.path + '，控制台正在重启…', 'ok');
  setTimeout(() => window.pywebview.api.close(), 1200);
});

$('btnCancel').addEventListener('click', () => window.pywebview.api.close());

/* ---------------- 启动 ---------------- */
window.addEventListener('pywebviewready', async () => {
  let st = null;
  try { st = await window.pywebview.api.status(); } catch (e) { /* 首次运行没有配置 */ }

  if (st && st.configured) {
    // 已配置过：不自动扫码，先告诉用户现状，让他自己决定要不要换
    $('qrSteps').style.display = 'none';
    $('qrBox').style.display = 'none';
    $('qrSub').textContent = '';
    setQrStatus('当前已配置：' + st.display.mac, 'dim');
    setMsg('凭据已经填好了。要换成另一台设备就点「重新扫码」；想手动改就点底部「扫码不成功？手动填写」。');
    const btn = document.createElement('button');
    btn.className = 'btn btn-primary';
    btn.textContent = '重新扫码';
    btn.style.width = '180px';
    btn.addEventListener('click', () => {
      btn.remove();
      $('qrBox').style.display = '';
      $('qrSteps').style.display = '';
      setMsg('');
      launchQr();
    });
    $('qrStage').appendChild(btn);
    return;
  }

  // 首次安装 / 未配置：直接进扫码
  launchQr();
});
</script>
</body>
</html>
