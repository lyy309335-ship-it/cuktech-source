<!DOCTYPE html>
<!--
  ⚠️ 已废弃（v1.1.0 起不再打包、不再使用），留着只作参考。

  原因：pywebview 6.2.1 的 WinForms 后端在同一进程里开第二个窗口时，那个窗口的
  WebView2 初始化会失败（0x80070578 无效窗口句柄）——窗口能显示但页面永远不加载，
  evaluate_js 直接挂死。所以运行管理改成注入到控制台页面里的浮层：
  见 console_overlay.js；服务没起来时的管理入口在 console_host.html 里。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>CUKTECH 控制台</title>
<style>
  :root{
    --bg:#0f1116; --card:#171a21; --card2:#1d212a; --line:rgba(255,255,255,.07);
    --fg:#e8ecf4; --mute:#878fa2; --accent:#6ee7d6; --warn:#facc15; --off:#39404e;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--fg); overflow:hidden;
    font:14px/1.5 "Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
    user-select:none; -webkit-user-select:none;
  }
  .wrap{height:100%;display:flex;flex-direction:column;padding:18px 18px 14px;gap:14px}

  header{display:flex;align-items:center;gap:10px}
  .logo{
    width:30px;height:30px;border-radius:9px;flex:0 0 auto;
    background:linear-gradient(135deg,#6ee7d6,#3b82f6);
    display:flex;align-items:center;justify-content:center;
  }
  .logo svg{width:16px;height:16px;fill:#0f1116}
  .h1{font-size:15px;font-weight:600;letter-spacing:.2px}
  .ver{font-size:11px;color:var(--mute);margin-left:auto;padding:2px 7px;border:1px solid var(--line);border-radius:20px}

  /* ---- 状态卡 ---- */
  .status{
    background:linear-gradient(160deg,#1b2b31,#151a21 60%);
    border:1px solid var(--line);border-radius:16px;padding:16px 18px;
    display:flex;align-items:flex-end;justify-content:space-between;
  }
  .power{display:flex;align-items:baseline;gap:6px}
  .power b{font-size:40px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-1px}
  .power span{font-size:14px;color:var(--mute)}
  .badge{
    font-size:11px;padding:3px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;
    background:rgba(255,255,255,.05);color:var(--mute);white-space:nowrap;
  }
  .badge i{width:6px;height:6px;border-radius:50%;background:var(--off);display:block}
  .badge.on{color:var(--accent);background:rgba(110,231,214,.12)}
  .badge.on i{background:var(--accent);box-shadow:0 0 6px var(--accent)}
  .ports{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .port{font-size:11px;color:var(--mute);background:rgba(255,255,255,.04);border-radius:8px;padding:3px 8px}
  .port b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}

  /* ---- 开关行 ---- */
  .group{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .row{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:default}
  .row+.row{border-top:1px solid var(--line)}
  .row .txt{flex:1;min-width:0}
  .row .t{font-size:13.5px}
  .row .d{font-size:11.5px;color:var(--mute);margin-top:1px}
  .sw{
    width:44px;height:24px;border-radius:20px;border:none;padding:0;position:relative;
    background:var(--off);cursor:pointer;transition:background .18s;flex:0 0 auto;
  }
  .sw::after{
    content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
    background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.4);
  }
  .sw.on{background:var(--accent)}
  .sw.on::after{transform:translateX(20px)}
  .sw:disabled{opacity:.45;cursor:not-allowed}

  /* ---- 按钮 ---- */
  .btns{display:flex;gap:10px}
  .btn{
    flex:1;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card2);
    color:var(--fg);font-size:13px;font-family:inherit;cursor:pointer;transition:.15s;
  }
  .btn:hover{background:#252a35;border-color:rgba(255,255,255,.14)}
  .btn.primary{background:linear-gradient(135deg,#2a9d8f,#3b82f6);border:none;color:#fff}
  .btn.primary:hover{filter:brightness(1.08)}

  footer{margin-top:auto;font-size:11px;color:#5d6474;line-height:1.6}
  footer b{color:#7d8494;font-weight:500}
  .dot{color:#2f3542;margin:0 5px}
  .hint{color:#4b93c7}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg></div>
    <div class="h1">CUKTECH 充电器</div>
    <div class="ver" id="ver">v-</div>
  </header>

  <div class="status">
    <div>
      <div class="power"><b id="total">--</b><span>W</span></div>
      <div class="ports" id="ports"></div>
    </div>
    <div class="badge" id="connBadge"><i></i><span id="connText">检查中</span></div>
  </div>

  <div class="group">
    <div class="row">
      <div class="txt"><div class="t">采集服务</div><div class="d">蓝牙读取充电器数据，关闭后所有控制失效</div></div>
      <button class="sw" id="swService"></button>
    </div>
    <div class="row">
      <div class="txt"><div class="t">桌面卡片</div><div class="d">常驻桌面的小窗，关闭可省内存</div></div>
      <button class="sw" id="swWidget"></button>
    </div>
    <div class="row">
      <div class="txt"><div class="t">开机自启</div><div class="d">登录系统后自动在托盘运行</div></div>
      <button class="sw" id="swAutostart"></button>
    </div>
  </div>

  <div class="btns">
    <button class="btn primary" id="btnConsole">打开控制台</button>
    <button class="btn" id="btnBrowser">浏览器</button>
    <button class="btn" id="btnData">数据目录</button>
  </div>

  <footer>
    <div>数据 <b id="dataDir">--</b></div>
    <div>控制台已内置在本程序里，不用再跳浏览器<span class="dot">·</span><span class="hint">关窗口只是收进托盘</span></div>
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
let api = null;
let busy = false;
let last = null;

function ready() {
  return !!(window.pywebview && window.pywebview.api);
}

function setSwitch(el, on, disabled = false) {
  el.classList.toggle('on', !!on);
  el.disabled = disabled || busy;
}

function render(s) {
  last = s;
  $('ver').textContent = 'v' + s.version;
  $('total').textContent = s.serviceReady ? s.total.toFixed(1) : '--';

  const badge = $('connBadge');
  const txt = $('connText');
  if (!s.serviceRunning) { badge.className = 'badge'; txt.textContent = '服务已停止'; }
  else if (s.serviceReady) { badge.className = 'badge on'; txt.textContent = '已连接'; }
  else { badge.className = 'badge'; txt.textContent = '连接中…'; }

  const ports = s.ports || {};
  // 协议里端口号是 piid 1..4，别写成 0..3（会整体错位一格、A 口丢失）
  const order = [['1','C1'],['2','C2'],['3','C3'],['4','A']];
  $('ports').innerHTML = order.map(([k, name]) => {
    const d = ports[k] || {};
    const w = d.power;
    const on = d.active ? '' : ' style="opacity:.45"';
    return `<span class="port"${on}>${name} <b>${(w === undefined || w === null) ? '—' : Number(w).toFixed(0) + 'W'}</b></span>`;
  }).join('');

  setSwitch($('swService'), s.serviceRunning, false);
  setSwitch($('swWidget'), s.widgetRunning, false);
  setSwitch($('swAutostart'), s.autostart, false);
  $('dataDir').textContent = s.dataDir;
}

async function refresh() {
  if (!ready() || busy) return;
  try { render(await api.get_state()); } catch (e) { /* 忽略瞬时错误 */ }
}

async function toggle(kind) {
  if (!ready() || busy) return;
  busy = true;
  const btn = kind === 'service' ? $('swService') : kind === 'widget' ? $('swWidget') : $('swAutostart');
  btn.disabled = true;
  try {
    const s = await api[kind === 'service' ? 'set_service'
              : kind === 'widget' ? 'set_widget' : 'set_autostart'](!btn.classList.contains('on'));
    if (s) render(s);
  } catch (e) {
    // 失败就刷新回真实状态
  } finally {
    busy = false;
    btn.disabled = false;
    refresh();
  }
}

$('swService').onclick = () => toggle('service');
$('swWidget').onclick = () => toggle('widget');
$('swAutostart').onclick = () => toggle('autostart');
$('btnConsole').onclick = () => ready() && api.open_console();
$('btnBrowser').onclick = () => ready() && api.open_browser_console();
$('btnData').onclick = () => ready() && api.open_data_dir();

function boot() {
  api = window.pywebview.api;
  refresh();
  setInterval(refresh, 2000);
}

window.addEventListener('pywebviewready', boot);
// 页面可能比 pywebviewready 更晚加载完，兜一次
setTimeout(() => { if (!api && ready()) boot(); }, 600);
</script>
</body>
</html>
