[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cuktech-ble-controller"
# 版本号由 desktop/version.py 派生：构建时 build_installer.sync_project_metadata()
# 会自动改写这一行，别手改（手改了下次出包也会被覆盖回去）。
version = "1.8.1"
description = "Local BLE controller and web UI for the CUKTECH 10 GaN Charger Ultra."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "CUKTECH BLE Controller contributors" }]
dependencies = [
  "aiohttp>=3.9",
  "bleak>=0.21",
  "cryptography>=41",
]

[project.urls]
Homepage = "https://github.com/zhyzhaogit/cuktech-ble-controller"
Issues = "https://github.com/zhyzhaogit/cuktech-ble-controller/issues"

[project.scripts]
cuktech-ble = "cuktech_ble_controller.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
